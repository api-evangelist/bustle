name: Bustle
description: >-
  Bustle is the flagship lifestyle and culture publication of Bustle Digital
  Group (BDG), a New York-based digital media company that moves culture forward
  through premium editorial content, social storytelling, and live experiences.
  BDG operates a portfolio of eight brands - Bustle, NYLON, Scary Mommy, W
  Magazine, Inverse, The Zoe Report, Romper, and Elite Daily - spanning
  lifestyle, fashion, parenting, entertainment, and luxury. The company produces
  award-winning branded content and campaigns through its BDG Studios and BDGx
  experiential arm. Bustle is a consumer media publisher rather than an API
  provider; this profile is maintained in the API Evangelist network as a
  company/portfolio lead, and no public developer API or specification has been
  identified on its properties.
